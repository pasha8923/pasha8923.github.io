<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ВЭД Суппорт</title>
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <style>
    .hero__logoWrap { overflow: visible; }
    .hero__logo {
      transform-origin: 50% 50%;
      will-change: transform, filter;
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }
    .dancing-title {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 1.35em;
      margin-right: -0.35em;
      overflow: visible;
      perspective: 700px;
      white-space: nowrap;
    }
    .dancing-title__word {
      display: inline-flex;
      align-items: baseline;
      transform-style: preserve-3d;
    }
    .dancing-title__shell,
    .dancing-title__char {
      display: inline-block;
      transform-origin: 50% 70%;
      will-change: transform, opacity, filter;
    }
    .dancing-title__shell--space { width: 0.33em; }
    .dancing-title__char {
      min-width: 0.03em;
      backface-visibility: hidden;
    }
    .sound-start {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 9999;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 12px 19px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      color: #fff;
      background: rgba(20, 20, 25, 0.93);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 160ms ease, opacity 160ms ease;
    }
    .sound-start:hover { transform: translateX(-50%) scale(1.04); }
    .sound-start:active { transform: translateX(-50%) scale(0.97); }
    .sound-start:disabled { cursor: wait; opacity: 0.72; }
    .sound-start[hidden] { display: none !important; }
    @media (max-width: 640px) {
      .dancing-title { white-space: normal; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero__logo,
      .dancing-title__char {
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="top" class="hero">
    <div class="container">
      <div class="hero__panel">
        <div class="hero__inner">
          <div>
            <h1 id="dancingTitle" class="h1 dancing-title" aria-label="ПУ ПУ ПУ">
              <span id="dancingWord" class="dancing-title__word" aria-hidden="true">ПУ ПУ ПУ</span>
            </h1>
            <p class="lead"></p>
            <div class="hero__cta"></div>
          </div>
          <div class="hero__logoWrap" aria-hidden="true">
            <img class="hero__logo" src="assets/logo.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>© <span class="js-year"></span> «ВЭД Суппорт». Мир открыт.</div>
      <div>vedsupport.com</div>
    </div>
  </footer>

  <!-- Музыкальный файл должен лежать по адресу /assets/intro.m4a -->
  <audio id="introMusic" preload="auto" loop playsinline>
    <source src="assets/intro.m4a" type="audio/mp4" />
  </audio>

  <!-- Кнопка видна сразу: Chrome/Edge запрещают звук без первого клика. -->
  <button id="soundStart" class="sound-start" type="button">▶ Включить музыку</button>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";

      var yearEls = document.querySelectorAll(".js-year");
      for (var yearIndex = 0; yearIndex < yearEls.length; yearIndex++) {
        yearEls[yearIndex].textContent = new Date().getFullYear();
      }

      var logo = document.querySelector(".hero__logo");
      var music = document.getElementById("introMusic");
      var soundStart = document.getElementById("soundStart");
      var title = document.getElementById("dancingTitle");
      var wordLayer = document.getElementById("dancingWord");
      if (!logo || !music || !soundStart || !title || !wordLayer) return;

      var words = ["ПУ ПУ ПУ", "ЧЗ", "ЭКОСБОР", "УТИЛЬ", "РУ", "ОКПЭД", "ТНВЭД", "ДЕМПИНГ"];
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      var audioContext = null;
      var analyser = null;
      var sourceNode = null;
      var frequencyData = null;
      var audioRunning = false;
      var analyserRunning = false;
      var switchingWord = false;
      var wordIndex = 0;
      var beatCount = 0;
      var spin = 0;
      var bassAverage = 0.12;
      var beatKick = 0;
      var lastBeatAt = 0;
      var lastWordChangeAt = 0;
      var lastTime = performance.now();
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      music.volume = 0.82;

      function renderWord(text) {
        var fragment = document.createDocumentFragment();
        for (var i = 0; i < text.length; i++) {
          var shell = document.createElement("span");
          shell.className = "dancing-title__shell";
          if (text.charAt(i) === " ") {
            shell.className += " dancing-title__shell--space";
            shell.setAttribute("aria-hidden", "true");
          } else {
            var character = document.createElement("span");
            character.className = "dancing-title__char";
            character.textContent = text.charAt(i);
            shell.appendChild(character);
          }
          fragment.appendChild(shell);
        }
        wordLayer.replaceChildren(fragment);
        title.setAttribute("aria-label", text);
      }

      function animateShells(shells, keyframes, optionsForIndex) {
        var jobs = [];
        for (var i = 0; i < shells.length; i++) {
          var animation = shells[i].animate(keyframes(i), optionsForIndex(i));
          jobs.push(animation.finished.catch(function () {}));
        }
        return Promise.all(jobs);
      }

      async function changeWord() {
        if (switchingWord || reduceMotion) return;
        switchingWord = true;
        var oldShells = Array.prototype.slice.call(wordLayer.querySelectorAll(".dancing-title__shell"));

        await animateShells(
          oldShells,
          function (i) {
            var direction = i % 2 === 0 ? -1 : 1;
            return [
              { opacity: 1, transform: "translate3d(0,0,0) rotate(0deg) scale(1)" },
              {
                opacity: 0,
                transform: "translate3d(" + (direction * (35 + i * 5)) + "px," + (-28 - (i % 3) * 14) + "px,0) rotate(" + (direction * (220 + i * 34)) + "deg) scale(0.25)"
              }
            ];
          },
          function (i) {
            return { duration: 430, delay: i * 28, easing: "cubic-bezier(.55,.02,.72,.44)", fill: "forwards" };
          }
        );

        wordIndex = (wordIndex + 1) % words.length;
        renderWord(words[wordIndex]);
        var newShells = Array.prototype.slice.call(wordLayer.querySelectorAll(".dancing-title__shell"));

        await animateShells(
          newShells,
          function (i) {
            var direction = i % 2 === 0 ? 1 : -1;
            return [
              {
                opacity: 0,
                transform: "translate3d(" + (direction * (42 + i * 4)) + "px," + (42 + (i % 3) * 10) + "px,0) rotate(" + (direction * (300 + i * 27)) + "deg) scale(0.2)"
              },
              { opacity: 1, transform: "translate3d(0,0,0) rotate(0deg) scale(1)" }
            ];
          },
          function (i) {
            return { duration: 620, delay: i * 42, easing: "cubic-bezier(.16,1.35,.38,1)", fill: "both" };
          }
        );

        switchingWord = false;
        lastWordChangeAt = performance.now();
        beatCount = 0;
      }

      function setupAudioGraph() {
        if (!AudioContextClass || audioContext) return;
        audioContext = new AudioContextClass();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.74;
        sourceNode = audioContext.createMediaElementSource(music);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
      }

      function rangeEnergy(fromHz, toHz) {
        if (!analyserRunning || !analyser || !frequencyData || !audioContext) return 0;
        var nyquist = audioContext.sampleRate / 2;
        var start = Math.max(0, Math.floor((fromHz / nyquist) * frequencyData.length));
        var end = Math.min(frequencyData.length - 1, Math.ceil((toHz / nyquist) * frequencyData.length));
        if (end <= start) return 0;
        var sum = 0;
        var count = 0;
        for (var i = start; i <= end; i++) {
          sum += frequencyData[i];
          count++;
        }
        return count ? (sum / count) / 255 : 0;
      }

      function animate(now) {
        requestAnimationFrame(animate);
        var dt = Math.min(40, Math.max(0, now - lastTime));
        lastTime = now;
        var bass;
        var mids;
        var highs;

        if (analyserRunning && analyser && frequencyData) {
          analyser.getByteFrequencyData(frequencyData);
          bass = rangeEnergy(45, 180);
          mids = rangeEnergy(180, 1800);
          highs = rangeEnergy(1800, 7000);
        } else if (audioRunning) {
          var audioTime = music.currentTime || now / 1000;
          var pulse = Math.pow(Math.max(0, Math.sin(audioTime * Math.PI * 3.65)), 5);
          bass = 0.18 + pulse * 0.58;
          mids = 0.22 + Math.abs(Math.sin(audioTime * 3.1)) * 0.22;
          highs = 0.17 + Math.abs(Math.sin(audioTime * 7.4)) * 0.18;
        } else {
          bass = 0.035 + Math.abs(Math.sin(now / 620)) * 0.025;
          mids = 0.04;
          highs = 0.025;
        }

        bassAverage = bassAverage * 0.94 + bass * 0.06;
        var isBeat = audioRunning && bass > Math.max(0.27, bassAverage * 1.18) && now - lastBeatAt > 210;
        if (isBeat) {
          beatKick = 1;
          lastBeatAt = now;
          beatCount++;
        } else {
          beatKick *= 0.84;
        }

        if (audioRunning && !switchingWord && ((beatCount >= 7 && now - lastWordChangeAt > 2600) || now - lastWordChangeAt > 4400)) {
          changeWord();
        }
        if (reduceMotion) return;

        spin += (0.018 + mids * 0.13) * dt;
        var logoScale = 1 + bass * 0.24 + beatKick * 0.08;
        var logoJump = -(bass * 12 + beatKick * 7);
        var logoJitter = highs * 5 + beatKick * 1.3;
        var logoX = (Math.random() - 0.5) * logoJitter;
        var logoY = (Math.random() - 0.5) * logoJitter;
        var logoWobble = Math.sin(now / 118) * (2 + mids * 7);

        logo.style.transform = "translate3d(" + logoX.toFixed(2) + "px," + (logoJump + logoY).toFixed(2) + "px,0) rotate(" + (spin + logoWobble).toFixed(2) + "deg) scale(" + logoScale.toFixed(3) + ")";
        var glow = Math.min(24, 4 + bass * 16 + beatKick * 7);
        logo.style.filter = "drop-shadow(0 0 " + glow.toFixed(1) + "px rgba(255,255,255," + (0.12 + bass * 0.30).toFixed(2) + "))";

        var characters = wordLayer.querySelectorAll(".dancing-title__char");
        for (var charIndex = 0; charIndex < characters.length; charIndex++) {
          var character = characters[charIndex];
          var phase = now / 125 + charIndex * 0.88;
          var bounce = Math.sin(phase) * (1.8 + mids * 5.5) - bass * 9;
          var sway = Math.cos(now / 165 + charIndex * 0.72) * (1 + highs * 4);
          var rotation = Math.sin(now / 145 + charIndex * 1.05) * (3.5 + mids * 9) + (charIndex % 2 ? -1 : 1) * beatKick * 8;
          var charScale = 1 + bass * 0.11 + beatKick * (0.035 + (charIndex % 3) * 0.012);
          character.style.transform = "translate3d(" + sway.toFixed(2) + "px," + bounce.toFixed(2) + "px,0) rotate(" + rotation.toFixed(2) + "deg) scale(" + charScale.toFixed(3) + ")";
          character.style.filter = "drop-shadow(0 " + (2 + bass * 3).toFixed(1) + "px " + (2 + bass * 5).toFixed(1) + "px rgba(14,62,125," + (0.10 + bass * 0.18).toFixed(2) + "))";
        }
      }

      function markStarted() {
        audioRunning = true;
        lastWordChangeAt = performance.now();
        soundStart.hidden = true;
        soundStart.disabled = false;
        soundStart.textContent = "▶ Включить музыку";
      }

      async function startFromClick() {
        soundStart.disabled = true;
        soundStart.textContent = "Запускаю…";
        try {
          setupAudioGraph();
          if (audioContext && audioContext.state !== "running") await audioContext.resume();
          analyserRunning = Boolean(audioContext && audioContext.state === "running");
          await music.play();
          markStarted();
        } catch (error) {
          soundStart.hidden = false;
          soundStart.disabled = false;
          soundStart.textContent = "▶ Нажми ещё раз";
          console.warn("Не удалось запустить музыку:", error);
        }
      }

      async function tryAutoplay() {
        /* AudioContext создаётся только после клика, иначе Chrome зависает на resume(). */
        try {
          await music.play();
          markStarted();
        } catch (error) {
          soundStart.hidden = false;
        }
      }

      music.addEventListener("error", function () {
        soundStart.hidden = false;
        soundStart.disabled = true;
        soundStart.textContent = "Не найден assets/intro.m4a";
      });
      soundStart.addEventListener("click", startFromClick);

      renderWord(words[0]);
      requestAnimationFrame(animate);
      tryAutoplay();
    });
  </script>
</body>
</html>
